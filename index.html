<!DOCTYPE html>
<html>
<head>
<title>My Form</title>
<style>
td{text-align:left;}
td:first-child {text-align:right;}
</style>
</head>

<body>
<div style="background-color:lightgrey;text-align:center;width:550px;padding:15px;margin:auto">
<h2 style="color:red">Continental Hotel Reservation Form</h2>

<form>
<table style="background-color:lightblue;margin:auto" border="1">
<tr>
<td><b>Name</b></td>
<td><input type="text" placeholder="Enter your name"></td>
</tr>

<tr>
<td><b>eMail</b></td>
<td><input type="text" value="info@continental.pk"></td>
</tr>

<tr>
<td><b>Mobile No.</b></td>
<td><input type="number" placeholder="Enter your cell number"></td>
</tr>

<tr>
<td><b>Arrival Time</b></td>
<td><input type="time" placeholder="Enter your arrival time"></td>
</tr>

<tr>
<td><b>Departure</b></td>
<td><input type="text">  <input type="text"></td>
</tr>

<tr>
<td><b>Room Type</b></td>
<td align="left">
<input type="radio" name="room">Single<br>
<input type="radio" name="room">Double<br>
<input type="radio" name="room">Presidential Suite
</td>
</tr>

<tr>
<td><b>Preferences</b></td>
<td align="left">
<input type="checkbox">Non-Smoking<br>
<input type="checkbox">Internet<br>
<input type="checkbox">Firm Mattress
</td>
</tr>

<tr>
<td><b>Mode of Payment</b></td>
<td align="left">
<input type="radio" name="payment">Cash<br>
<input type="radio" name="payment">Check<br>
<input type="radio" name="payment">Credit Card
<select>
<option>Select Card</option>
<option>Visa</option>
<option>MasterCard</option>
</select>
</td>
</tr>

<tr>
<td colspan="2" style="text-align:center"><input type="submit" value="Send Data"></td>
</tr>
</table>
</form>
</div>
</body>
</html>
